<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/swerrve_logo_white.png" />
    <link rel="apple-touch-icon" href="/images/swerrve_logo_white.png" />

    <!-- Primary SEO -->
    <title>SWERRV — Visual Catalogue</title>
    <meta name="description" content="A read-only visual catalogue exploring silhouettes, texture, and clothing as a moving image." />
