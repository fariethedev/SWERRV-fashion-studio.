spring.application.name=swerrv
spring.config.import=optional:file:.env[.properties]

# ============================================================
# Database Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/swerrv?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password= REDACTED_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret= REDACTED_JWT_SECRET
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=*

# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# Multipart and request size limits (for large base64 JSON uploads)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# ============================================================
# Stripe
# ============================================================
stripe.api.key=REDACTED_STRIPE_SECRET
stripe.webhook.secret= REDACTED_STRIPE_WEBHOOK_SECRET

# ============================================================
# Shipping
# ============================================================
shipping.provider=InPost
# shipping.provider=DPD

# ============================================================
# Google Auth
# ============================================================# Google Authentiation config
google.client.id=623289467260-eaagaa60b6hdjguaongmbrij0pfh860h.apps.googleusercontent.com

# ============================================================
# Email / AWS SES SMTP Configuration
# ============================================================
spring.mail.host=${SES_SMTP_HOST:email-smtp.eu-north-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME:your_smtp_username_here}
spring.mail.password=${SES_SMTP_PASSWORD:your_smtp_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
swerrv.mail.from=${SES_SENDER_EMAIL:orders@swerrv.shop}

# Google Authentiation config
google.client.secret= REDACTED_GOOGLE_CLIENT_SECRET
